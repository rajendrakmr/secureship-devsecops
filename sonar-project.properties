sonar.projectKey=secureship-devsecops
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Memory / speed on a small runner
sonar.javascript.node.maxspace=256
sonar.scanner.skipSystemTruststore=true

# Keep coverage noise out of the numbers
sonar.coverage.exclusions=tests/**,src/server.js